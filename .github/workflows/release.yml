name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g., v0.2.2)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g., v0.2.2)"
        required: true
        type: string

permissions:
  contents: read

env:
  BINARY_NAME: centaurai-core
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  AIONUI_EMBED_BUN: "1"
  BUN_VARIANT: default
  # cross commit used by the v0.1.39/v0.1.40 Linux ARM64 release builds.
  CROSS_GIT_REV: "29d00c7803f221f1b3f35e561b03792368fb8339"
  LINUX_X64_GLIBC_MAX: "GLIBC_2.34"
  LINUX_ARM64_GLIBC_MAX: "GLIBC_2.30"
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract version from tag
        id: metadata
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release contract
        shell: bash
        run: scripts/check-release-contract.sh "${RELEASE_TAG}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64: build natively on ubuntu-22.04 (GLIBC 2.35) so the
          # release binary runs on Debian 12 / Ubuntu 22.04+ / RHEL 9 /
          # CentOS Stream 9. We cannot use `cross` here because the default
          # cross docker image ships a gcc that aws-lc-sys's memcmp safety
          # check rejects. Pinning the runner is simpler and covers the
          # target audience — Debian 11 (GLIBC 2.31) is entering ELTS so we
          # deliberately drop it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: centaurai-core
          # Linux aarch64: keep `cross` (its image happens to not trip the
          # aws-lc-sys check and also yields an older GLIBC baseline).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: centaurai-core
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: centaurai-core
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: centaurai-core
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: centaurai-core.exe
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: centaurai-core.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned stable action
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Include runner OS image and cross baseline in the cache key.
          # Proc-macro .so files link against the host GLIBC, so switching
          # the runner (ubuntu-24.04 ↔ 22.04) or flipping native ↔ cross
          # must fall into a different cache bucket — otherwise the cached
          # .so is loaded against an incompatible GLIBC and cargo panics
          # with "can't find crate" / "GLIBC_* not found" errors.
          shared-key: release-${{ matrix.target }}-${{ matrix.os }}${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('-glibc-{0}', env.LINUX_X64_GLIBC_MAX) || '' }}${{ matrix.use_cross == true && format('-cross-{0}-glibc-{1}', env.CROSS_GIT_REV, env.LINUX_ARM64_GLIBC_MAX) || '' }}

      - name: Verify pinned Linux ARM64 cross image is available
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:99e041b94e7d4f31477c6ddede176688562c3762ba3833b75de3316100afc39d

      - name: Install cross (Linux targets)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_GIT_REV}" --locked

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          if [[ -n "${RUSTFLAGS:-}" ]]; then
            echo "Using RUSTFLAGS=${RUSTFLAGS}"
          fi
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p aionui-app
          else
            cargo build --release --target ${{ matrix.target }} -p aionui-app
          fi

      - name: Verify Linux ARM64 GLIBC baseline
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_ARM64_GLIBC_MAX}"

      - name: Verify Linux x64 GLIBC baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_X64_GLIBC_MAX}"

      - name: Capture capabilities from Linux x64 release binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          data_dir="$(mktemp -d)"
          log_file="${RUNNER_TEMP}/centaurai-core-capabilities.log"
          mkdir -p dist

          cleanup() {
            if [[ -n "${core_pid:-}" ]] && kill -0 "${core_pid}" 2>/dev/null; then
              kill -TERM "${core_pid}" 2>/dev/null || true
              wait "${core_pid}" 2>/dev/null || true
            fi
            rm -rf "${data_dir}"
          }
          trap cleanup EXIT

          "${binary}" --host 127.0.0.1 --port 0 --data-dir "${data_dir}" --local >"${log_file}" 2>&1 &
          core_pid=$!

          listening_payload=""
          for _ in $(seq 1 60); do
            listening_payload="$(sed -n 's/^CENTAURAI_CORE_LISTENING //p' "${log_file}" | head -n 1)"
            if [[ -n "${listening_payload}" ]]; then
              break
            fi
            if ! kill -0 "${core_pid}" 2>/dev/null; then
              cat "${log_file}"
              echo "release binary exited before emitting its listening contract" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ -z "${listening_payload}" ]]; then
            cat "${log_file}"
            echo "timed out waiting for the release binary listening contract" >&2
            exit 1
          fi

          port="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["port"])' "${listening_payload}")"
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${port}/api/capabilities" \
              --output dist/centaurai-core-capabilities.json; then
              break
            fi
            if ! kill -0 "${core_pid}" 2>/dev/null; then
              cat "${log_file}"
              echo "release binary exited before capabilities became available" >&2
              exit 1
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("dist/centaurai-core-capabilities.json")
          if not path.is_file():
              raise SystemExit("capabilities response was not captured")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("success") is not True or not isinstance(payload.get("data"), dict):
              raise SystemExit("release binary returned an invalid capabilities envelope")
          required = {
              "decision_per_brain_knowledge_egress",
              "idempotent_resource_creation",
              "knowledge_dispatch_egress_gate",
              "knowledge_upload_idempotency_v2",
              "provider_ssrf_pinned_dns",
          }
          features = payload["data"].get("features", {})
          missing = sorted(feature for feature in required if features.get(feature) is not True)
          if missing:
              raise SystemExit(f"release binary is missing required capabilities: {missing}")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="centaurai-core-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "centaurai-core-v${env:VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - prepare-release
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd artifacts
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = {}
          for path in sorted(Path(".").glob("centaurai-core-v*")):
              assets[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }
          if len(assets) != 6:
              raise SystemExit(f"expected six platform assets, found {len(assets)}")
          capabilities_path = Path("centaurai-core-capabilities.json")
          if not capabilities_path.is_file():
              raise SystemExit("missing capabilities captured from the Linux x64 release binary")
          capabilities_response = json.loads(capabilities_path.read_text(encoding="utf-8"))
          if capabilities_response.get("success") is not True:
              raise SystemExit("captured capabilities response was not successful")
          manifest = {
              "schema_version": 1,
              "name": "centaurai-core",
              "version": os.environ["VERSION"],
              "repository": os.environ["REPOSITORY"],
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["SOURCE_COMMIT"],
              "capabilities": capabilities_response["data"],
              "assets": assets,
          }
          Path("centaurai-core-release.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum centaurai-core-* > centaurai-core-checksums.txt

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
          echo "Uploaded assets to ${release_url}"
